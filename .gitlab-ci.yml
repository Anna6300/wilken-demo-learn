# Demo CI/CD pipeline with quality gates for a product shipped both as SaaS (cloud) and on-prem.
#
#   QG1 Commit     -> build + unit tests + coverage >= 80 %         (every push / merge request)
#   QG2 Merge      -> QG1 + static analysis, no new critical issues (MR into main)
#   QG3 Staging    -> smoke + E2E (Selenium + TestCafe) on cloud staging AND on-prem reference install
#   QG4 Release    -> full regression green in Xray, no open blocker/critical bugs, manual QA sign-off
#
# Every gate fails the pipeline - nothing is promoted "with a known red".

stages:
  - build
  - test
  - quality-gate
  - deploy-staging
  - e2e
  - report
  - release

default:
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven
    paths: [.m2/repository]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI: "--batch-mode --errors --show-version"

# ---------- QG1: commit gate ----------
build:
  stage: build
  script:
    - mvn $MAVEN_CLI compile

unit-tests:
  stage: test
  script:
    - mvn $MAVEN_CLI verify          # runs unit tests + JaCoCo coverage check (fails below 80 %)
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml   # test results shown directly in the merge request
    paths:
      - target/surefire-reports/
      - target/site/jacoco/

# ---------- QG2: merge gate ----------
static-analysis:
  stage: quality-gate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # SonarQube quality gate: no new bugs/vulnerabilities, coverage on new code >= 80 %, duplication < 3 %
    - mvn $MAVEN_CLI sonar:sonar -Dsonar.qualitygate.wait=true
  allow_failure: false

dependency-scan:
  stage: quality-gate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mvn $MAVEN_CLI org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

# ---------- QG3: staging gate (both delivery models) ----------
deploy-cloud-staging:
  stage: deploy-staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: cloud-staging
    url: https://staging.example-portal.cloud
  script:
    - echo "Deploy container image to cloud staging tenant (k8s / helm upgrade)"

deploy-onprem-reference:
  stage: deploy-staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: onprem-reference
    url: https://onprem-ref.test.internal
  script:
    - echo "Install release package on on-prem reference system (oldest supported DB + OS version)"
    - echo "Run DB migration from previous released version -> upgrade path is tested, not only fresh install"

.e2e-matrix:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  parallel:
    matrix:
      - TARGET: cloud
        PORTAL_URL: https://staging.example-portal.cloud/abschlagsrechner.html
      - TARGET: onprem
        PORTAL_URL: https://onprem-ref.test.internal/abschlagsrechner.html

e2e-selenium:
  extends: .e2e-matrix
  stage: e2e
  image: markhobson/maven-chrome:jdk-21
  script:
    - mvn $MAVEN_CLI test -Dgroups=ui -Dexcluded.groups= -Djacoco.skip=true -Dportal.url=$PORTAL_URL
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml

e2e-testcafe:
  extends: .e2e-matrix
  stage: e2e
  image: testcafe/testcafe:latest
  script:
    - cd e2e-testcafe && npm ci && npm test
  artifacts:
    when: always
    reports:
      junit: e2e-testcafe/reports/testcafe-junit.xml

# ---------- Traceability: push results to Jira Xray ----------
xray-import:
  stage: report
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: always
  script:
    - 'TOKEN=$(curl -s -H "Content-Type: application/json" -X POST
        --data "{\"client_id\":\"$XRAY_CLIENT_ID\",\"client_secret\":\"$XRAY_CLIENT_SECRET\"}"
        https://xray.cloud.getxray.app/api/v2/authenticate | tr -d \")'
    - 'for f in target/surefire-reports/TEST-*.xml; do
         curl -s -H "Content-Type: text/xml" -H "Authorization: Bearer $TOKEN" --data @"$f"
           "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=$XRAY_PROJECT&testPlanKey=$XRAY_TEST_PLAN";
       done'

# ---------- QG4: release gate ----------
release-gate:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Check via Jira API - Xray test plan 100 % executed, 0 failed; 0 open Blocker/Critical bugs for fixVersion"
  allow_failure: false

release-cloud:
  stage: release
  needs: [release-gate]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual                      # QA + PO sign-off, then rolling/canary rollout
  environment: production-cloud
  script:
    - echo "Canary rollout to 5 % of tenants, monitor error rate, then 100 %"

release-onprem-package:
  stage: release
  needs: [release-gate]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  script:
    - echo "Build signed installer + release notes + upgrade guide for on-prem customers"
